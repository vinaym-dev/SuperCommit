name: Super Commit on Auto PR Merge

on:
  pull_request:
    types: [closed]

jobs:
  on_merge:
    # ✅ Run only when the PR is merged (not just closed)
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'feature/') &&
      contains(github.event.pull_request.title, 'Auto PR (Build → Validate Test)')
    runs-on: ubuntu-latest

    steps:
      # ✅ Checkout the feature branch being merged
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      # ✅ Node setup (same as before)
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ✅ Derive Jira key from the branch name (same logic retained)
      - name: Derive Jira key from branch
        id: vars
        shell: bash
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          if [[ "$BRANCH" =~ ([A-Z]+-[0-9]+) ]]; then
            echo "key=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          else
            echo "key=" >> $GITHUB_OUTPUT
          fi

      # ✅ Step 1: Auto-update Ready = Yes automatically after successful Auto PR merge
      #    ⛔ Removed STATUS transition to prevent Jira issue from moving forward automatically.
      - name: Auto-update Ready=Yes for merged Auto PRs
        if: ${{ steps.vars.outputs.key != '' }}
        env:
          COMMIT_MESSAGE: "${{ steps.vars.outputs.key }} READY:Yes COMMENT:Auto Ready flip on merged Auto PR"
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TEMPO_TOKEN: ${{ secrets.TEMPO_TOKEN }}
          TEMPO_AUTHOR_ACCOUNT_ID: ${{ secrets.TEMPO_AUTHOR_ACCOUNT_ID }}
          DRY_RUN: "false"
        run: node scripts/supercommit/index.js